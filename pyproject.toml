[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tdd-gleaner"
version = "0.1.0"
description = "Experiment store and annotation tools for tdd-gleaner."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gleaner = "gleaner.cli:main"

[tool.setuptools]
packages = ["gleaner"]
